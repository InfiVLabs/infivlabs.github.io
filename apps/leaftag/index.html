<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leaftag</title>
<style>
:root{--paper:#f4efe6;--shelf:#e9e1d3;--ink:#1d1b18;--muted:#5d564c;--accent:#c4421d;--line:#d6ccbb;
--display:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--paper:#171512;--shelf:#221f1a;--ink:#ede6da;--muted:#a89f92;--accent:#f07a52;--line:#3a352d}}
body{font-family:system-ui,sans-serif;max-width:680px;margin:2rem auto;padding:0 1.25rem;line-height:1.55;color:var(--ink);background:var(--paper)}
h1,h2,h3{font-family:var(--display);line-height:1.15}a{color:var(--accent)}
.back a{color:var(--muted);text-decoration:none}.back a::before{content:"← "}
.icon{border-radius:22%;display:block}
.lead{font-size:1.15rem;color:var(--muted)}
.button{display:inline-block;padding:.75rem 1.25rem;border-radius:6px;background:var(--ink);color:var(--paper);text-decoration:none;font-weight:600}
.stamp{display:inline-block;padding:.15rem .55rem;border:2px solid currentColor;border-radius:3px;font-size:.8rem;font-weight:700;color:var(--muted)}
.stamp-live{color:#2f7a4a}.stamp-review{color:#8a5a00}.stamp-testing{color:var(--accent)}
@media (prefers-color-scheme:dark){.stamp-live{color:#7cc89a}.stamp-review{color:#e2b45c}}
.home{max-width:1040px}
.hero{padding:2.5rem 0 1.5rem;position:relative}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--ink);transform-origin:left;animation:draw .9s .45s cubic-bezier(.6,0,.2,1) both}
.hero h1 span{display:inline-block;animation:rise .7s calc(var(--w)*70ms) cubic-bezier(.2,.7,.2,1) both}
.hero .lead{animation:rise .7s .5s cubic-bezier(.2,.7,.2,1) both}
.wordmark{font-weight:800;letter-spacing:-.02em;font-size:1.1rem;margin:0}
.hero h1{font-size:clamp(2.4rem,7vw,4.6rem);font-weight:700;letter-spacing:-.02em;margin:.6rem 0 .8rem;max-width:15ch}
.hero .lead{max-width:34rem;margin:0}
section h2{font-size:1.6rem;margin:2.5rem 0 1rem}
.shelf{list-style:none;padding:0;margin:0;display:grid;gap:1.75rem;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr))}
.app{display:flex;flex-direction:column;gap:.75rem;color:inherit;text-decoration:none}
.shelf li{animation:rise .7s calc(.7s + var(--i)*120ms) cubic-bezier(.2,.7,.2,1) both}
.feature{width:100%;height:auto;border-radius:8px;box-shadow:0 1px 0 var(--line),0 8px 20px -12px rgba(0,0,0,.35);transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s}
.app:hover .feature,.app:focus-visible .feature{transform:translateY(-6px);box-shadow:0 1px 0 var(--line),0 22px 30px -18px rgba(0,0,0,.45)}
.app-line .icon{transition:transform .45s cubic-bezier(.3,1.6,.5,1)}.app:hover .app-line .icon,.app:focus-visible .app-line .icon{transform:rotate(-8deg) scale(1.06)}
.app-line{display:flex;gap:.85rem;align-items:center}.app-line .icon{width:56px;height:56px;flex:none}
.app-line b{display:block;font-family:var(--display);font-size:1.25rem}
.app-line span{color:var(--muted);font-size:.95rem}.app-line b{color:var(--ink)}
.app .stamp{align-self:flex-start;animation:stamp .5s calc(1.15s + var(--i)*120ms) cubic-bezier(.3,1.4,.5,1) both}
tbody tr{animation:rise .5s calc(var(--i)*50ms) ease-out both}
.table{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:560px}
th,td{text-align:left;padding:.55rem .75rem .55rem 0;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.85rem;color:var(--muted)}td a{margin-right:.6rem}td .icon{width:40px;height:40px}
footer{margin:3rem 0 1rem;padding-top:1rem;border-top:1px solid var(--line);color:var(--muted)}
@keyframes rise{from{opacity:0;transform:translateY(.6em)}}
@keyframes draw{from{transform:scaleX(0)}}
@keyframes stamp{0%{opacity:0;transform:scale(1.9) rotate(-12deg)}60%{opacity:1;transform:scale(.94) rotate(-1deg)}100%{transform:rotate(-2deg)}}
@media (prefers-reduced-motion:reduce){*,::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<p class="back"><a href="/">InfiV Labs</a></p>
<img class="icon" src="icon.png" alt="" width="96" height="96">
<h1>Leaftag</h1>
<p class="lead">Plant watering schedules that learn from your soil checks. Light meter included.</p>
<p><a href="privacy/">Privacy policy</a> · <a href="terms/">Terms of use</a></p>
<p>Support: <a href="mailto:infivlabs@gmail.com">infivlabs@gmail.com</a></p>
</body>
</html>
